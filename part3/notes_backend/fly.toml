# fly.toml app configuration file generated for notes-backend-calm-firefly-210 on 2026-11-17T17:07:17+02:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'notes-backend-calm-firefly-210'
primary_region = 'arn'

[env]
  PORT="3001"

[build]
[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
